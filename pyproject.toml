[project]
name = "qsim-visit"
version = "0.1.0"
description = "The qsim_visit talk on single-photon atom clock interferometry, built from manim-atoms scenes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.1",
    "manim>=0.21.0",
    "manim-atoms[slides,plots]",
    "manim-slides[pyside6]>=5.7.0",
    "matplotlib>=3.11.2",
]

[tool.uv]
# a talk, not a package: its code is the scripts under talk/ and plot_scripts/
package = false

[tool.uv.sources]
manim-atoms = { path = "../manim-atoms", editable = true }
